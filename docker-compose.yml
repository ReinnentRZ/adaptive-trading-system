services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-trading-bot
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
