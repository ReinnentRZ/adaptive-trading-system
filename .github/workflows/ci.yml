name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache TA-Lib C-Library
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/libta_lib*
            /usr/include/ta-lib
          key: ${{ runner.os }}-talib-0.4.0

      - name: Install TA-Lib C-Library
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget curl
          curl -fsSL --retry 3 "https://github.com/ta-lib/ta-lib/releases/download/v0.4.0/ta-lib-0.4.0-src.tar.gz" -o ta-lib-0.4.0-src.tar.gz || \
          curl -fsSL --retry 3 "https://sourceforge.net/projects/ta-lib/files/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz/download" -o ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Ensure TA-Lib Shared Object Loaded
        run: |
          sudo ldconfig
          echo "TA_LIBRARY_PATH=/usr/lib" >> $GITHUB_ENV
          echo "TA_INCLUDE_PATH=/usr/include" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-mock
          pip install -r requirements.txt

      - name: Linting check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --exclude=.venv,venv,.git,__pycache__,build,dist --show-source --statistics
          # exit-zero treats all formatting and complexity warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --exclude=.venv,venv,.git,__pycache__,build,dist --statistics

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v
