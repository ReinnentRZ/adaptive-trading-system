name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache TA-Lib C-library
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: /tmp/ta-lib-build
          key: ${{ runner.os }}-ta-lib-0.4.0

      - name: Install TA-Lib C-library
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz -O /tmp/ta-lib-0.4.0-src.tar.gz
          tar -xzf /tmp/ta-lib-0.4.0-src.tar.gz -C /tmp
          cd /tmp/ta-lib
          ./configure --prefix=/tmp/ta-lib-build
          make
          make install

      - name: Install TA-Lib C-library to Runner System
        run: |
          sudo cp -r /tmp/ta-lib-build/include/* /usr/include/
          sudo cp -r /tmp/ta-lib-build/lib/* /usr/lib/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-mock
          pip install -r requirements.txt

      - name: Linting check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/
