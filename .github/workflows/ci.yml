name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linter Dependencies
        run: |
          pip install flake8 black

      - name: Run Flake8 Lint
        run: |
          # Periksa syntax error dan undefined names
          flake8 . --count --select=E9,F63,F7,F82 --exclude=.venv,venv,.git,__pycache__,build,dist --show-source --statistics
          # Warning check dengan batas line-length wajar
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --exclude=.venv,venv,.git,__pycache__,build,dist --statistics

  test-in-docker:
    name: Run Unit Tests (Docker Environment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Environment File & Directories
        run: |
          cp .env.example .env
          mkdir -p -m 777 data logs
          chmod -R 777 data logs 2>/dev/null || true

      - name: Build Docker Test Image
        run: |
          docker compose build adaptive-trading-bot

      - name: Execute Pytest Suite Inside Container
        run: |
          docker compose run --rm adaptive-trading-bot pytest tests/ -v
