name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies & TA-Lib C-Library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential wget
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz -O /tmp/ta-lib-0.4.0-src.tar.gz
          tar -xzf /tmp/ta-lib-0.4.0-src.tar.gz -C /tmp
          cd /tmp/ta-lib
          ./configure --prefix=/usr
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          rm -rf /tmp/ta-lib*

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-mock
          pip install -r requirements.txt

      - name: Linting check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --exclude=.venv,venv,.git,__pycache__,build,dist --show-source --statistics
          # exit-zero treats all formatting and complexity warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --exclude=.venv,venv,.git,__pycache__,build,dist --statistics

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v
