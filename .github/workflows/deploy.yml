name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Unit Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache TA-Lib C-Library
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/libta_lib*
            /usr/include/ta-lib
          key: ${{ runner.os }}-talib-0.4.0

      - name: Install TA-Lib C-Library
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget curl
          curl -fsSL --retry 3 "https://github.com/ta-lib/ta-lib/releases/download/v0.4.0/ta-lib-0.4.0-src.tar.gz" -o ta-lib-0.4.0-src.tar.gz || \
          curl -fsSL --retry 3 "https://sourceforge.net/projects/ta-lib/files/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz/download" -o ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Ensure TA-Lib Shared Object Loaded
        run: |
          sudo ldconfig
          echo "TA_LIBRARY_PATH=/usr/lib" >> $GITHUB_ENV
          echo "TA_INCLUDE_PATH=/usr/include" >> $GITHUB_ENV

      - name: Install Python Dependencies & Test Runners
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock
          pip install -r requirements.txt

      - name: Execute Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

  build-and-push:
    name: Docker Build & Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
